# The URL the site will be built for
base_url = "https://dunateo.github.io/"

# The site title and description; used in feeds and meta tags.
title = "Duna's Kiat"
description = "Notes from a computer science engineer working in security, plus a daily security news roundup."

# The default language; used in feeds.
default_language = "en"

# Theme built from the Socle design kit (themes/socle).
theme = "socle"

# For overriding the default ouput directory `public`, set it to another value (e.g.: "docs")
output_dir = "public"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

skip_content_templating = ["news/**"]

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
copyright = "Dunateo"

# Main navigation, in display order
menus = [
    { name = "Home", url = "/" },
    { name = "Posts", url = "/posts/" },
    { name = "News", url = "/news/" },
    { name = "About", url = "/about/" },
]

# Footer links. icon: github twitter
[[extra.social]]
icon = "github"
name = "GitHub"
url = "https://github.com/Dunateo"

[[extra.social]]
icon = "twitter"
name = "Twitter"
url = "https://twitter.com/BruValentin1"
