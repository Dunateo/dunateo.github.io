{% extends "base.html" %}

{% block main %}
<section class="not-found" aria-labelledby="nf-title">
    <p class="not-found__code" aria-hidden="true">404</p>
    <div class="sc-spectrum" aria-hidden="true"></div>
    <h1 id="nf-title" class="h1">Page not found</h1>
    <p class="lead">This page moved or never existed. The posts and the daily news are still where you left them.</p>
    <div class="actions">
        <a class="sc-btn sc-btn--primary" href="{{ config.base_url }}">Go to the home page</a>
        <a class="sc-btn" href="{{ get_url(path='/news/') }}">Latest news</a>
    </div>
</section>
{% endblock main %}
